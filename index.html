<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foto Profil Instagram HD</title>
<style>
  :root { --bg:#f2f4f8; --ink:#111827; --muted:#5b6475; --line:#d5dae4; --accent:#4f46e5; --surface:#fff; --err:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1220; --ink:#eef0f7; --muted:#9aa3b8; --line:#2a3050; --accent:#8b83ff; --surface:#171b30; --err:#ff8a7a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 Georgia, "Times New Roman", serif; min-height:100vh; display:grid; place-items:start center; padding:8vh 20px 40px; }
  main { width:100%; max-width:460px; }
  h1 { font-size:2rem; line-height:1.15; margin:0 0 8px; letter-spacing:-.01em; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  form { display:flex; gap:8px; }
  input { flex:1; min-width:0; padding:12px 14px; font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px; }
  button, a.btn { font:inherit; padding:12px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; text-decoration:none; display:inline-block; }
  button:disabled { opacity:.6; cursor:wait; }
  a.alt { background:transparent; color:var(--ink); border:1px solid var(--line); }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  #out { margin-top:28px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px; text-align:center; }
  .card img { width:100%; max-width:360px; aspect-ratio:1; object-fit:cover; border-radius:50%; background:var(--line); }
  .card h2 { margin:14px 0 2px; font-size:1.2rem; }
  .meta { color:var(--muted); font-size:.9rem; margin:0 0 16px; }
  .actions { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .err { color:var(--err); }
  .note { font-size:.85rem; color:var(--muted); margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1>Foto profil Instagram, resolusi penuh</h1>
  <p class="sub">Masukkan username untuk melihat dan mengunduh foto profilnya dalam ukuran terbesar yang tersedia.</p>
  <form id="f">
    <input id="u" placeholder="username" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Username Instagram" required>
    <button id="b">Cari foto</button>
  </form>
  <div id="out" aria-live="polite"></div>
</main>
<script>
const f = document.getElementById("f"), u = document.getElementById("u"), b = document.getElementById("b"), out = document.getElementById("out");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

f.addEventListener("submit", async e => {
  e.preventDefault();
  const name = u.value.trim().replace(/^@/, "");
  if (!name) return;
  b.disabled = true; b.textContent = "Mencari…"; out.innerHTML = "";
  try {
    const r = await fetch("/api/profile?username=" + encodeURIComponent(name));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Terjadi kesalahan.");
    const img = "/api/image?url=" + encodeURIComponent(d.url);
    const size = d.width ? `${d.width}×${d.height}px` : "ukuran standar";
    out.innerHTML = `
      <div class="card">
        <img src="${img}" alt="Foto profil ${esc(d.username)}">
        <h2>${esc(d.fullName || d.username)}</h2>
        <p class="meta">@${esc(d.username)}${d.isPrivate ? " (akun privat)" : ""} · ${size}</p>
        <div class="actions">
          <a class="btn" href="${img}&download=1&name=${encodeURIComponent(d.username)}">Unduh gambar</a>
          <a class="btn alt" href="${img}" target="_blank" rel="noopener">Buka ukuran penuh</a>
        </div>
        ${d.quality !== "hd" ? '<p class="note">Hasil ini ukuran standar. Untuk resolusi penuh, aktifkan IG_SESSIONID di server.</p>' : ""}
      </div>`;
  } catch (err) {
    out.innerHTML = `<p class="err">${esc(err.message)}</p>`;
  } finally {
    b.disabled = false; b.textContent = "Cari foto";
  }
});
</script>
</body>
</html>
